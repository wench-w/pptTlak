[project]
name = "ppt-talk-builder"
version = "0.1.0"
description = "从 PPT 备注生成语音并合成带字幕的演讲视频的工具"
readme = "README.md"
authors = [{ name = "AutoGenerated", email = "auto@example.com" }]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "python-pptx>=0.6.23",
    "moviepy>=1.0.3,<2.0",
    "pillow<10.0.0",
    "pydub>=0.25.1",
    "mutagen>=1.47.0",
    "edge-tts>=6.1.0",
    "srt>=3.5.2",
    "tqdm>=4.66.4",
    "python-dotenv>=1.0.1",
    "streamlit>=1.39.0",
    "pymupdf>=1.24.10"
]

[project.scripts]
ppt-talk-builder = "ppt_talk_builder.cli:app"

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ppt_talk_builder*"]

